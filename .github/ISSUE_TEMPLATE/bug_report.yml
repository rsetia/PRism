name: Bug report
description: Report reproducible incorrect behavior in Prism
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include secrets or private repository data. Report vulnerabilities using the private security link in the template chooser.

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Core SDK
        - Node adapters and executors
        - CLI
        - Beads graph generation
        - Packaging and documentation
        - Unsure or other
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest graph, code sample, or command sequence that demonstrates the problem.
      render: shell
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Prism version or commit
      placeholder: 0.1.0-alpha.0 or commit SHA
    validations:
      required: true

  - type: input
    id: node_version
    attributes:
      label: Node.js version
      placeholder: Output of node --version
    validations:
      required: true

  - type: input
    id: operating_system
    attributes:
      label: Operating system
      placeholder: macOS 15, Ubuntu 24.04, Windows 11, etc.
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Additional diagnostics
      description: Add sanitized logs, event output, or other relevant context.

  - type: checkboxes
    id: confirmation
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: This report contains no secrets or private repository data.
          required: true
        - label: This is not a security vulnerability.
          required: true
